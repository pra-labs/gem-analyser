name: GeM Bid Scraper & Sync

on:
  schedule:
    # Run every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run GeM Scraper
        run: |
          python3 scraper/scrape.py --pages 2
          # Keep src/data/ in sync for edge and Vercel bundling
          mkdir -p app/src/data
          cp data/bids.json app/src/data/bids.json

      - name: Commit and Push Updated Bids
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/bids.json app/public/data/bids.json app/src/data/bids.json
          if git diff --staged --quiet; then
            echo "No new bids found, skipping commit."
          else
            git commit -m "chore(data): auto-update GeM bids [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git push
          fi
